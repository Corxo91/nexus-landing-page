name: Deploy Next.js to GitHub Pages (Actions)

on:
  push:
    branches: [ main ]

# Permisos obligatorios del flujo oficial de Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita carreras: solo se publica el último push
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS) + Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn   # cache nativo de setup-node para Yarn (no cachea node_modules)

      - name: Enable Corepack & Install deps
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Restore Next.js incremental cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Build & Export estático
        run: |
          yarn build
          yarn export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out   # carpeta generada por `next export`

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
